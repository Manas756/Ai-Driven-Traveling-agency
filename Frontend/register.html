<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nomway — Create Account</title>
  <link rel="stylesheet" href="reset.css">
  <link rel="stylesheet" href="register.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="index.html" class="logo">nom<span>way</span></a>
    <a href="login.html" class="nav-login">Already have an account? Login</a>
  </nav>

  <!-- MAIN -->
  <main class="register-main">

    <div class="register-card">

      <h1>Create your account</h1>
      <p class="subtitle">Who are you joining as?</p>

      <!-- CHOICE BUTTONS -->
      <div class="choice-group">

        <a href="dashboard.html" class="choice-btn" id="choice-traveler">
          <span class="choice-icon">✈️</span>
          <span class="choice-title">I am a Traveler</span>
          <span class="choice-desc">Plan trips with AI agents</span>
        </a>

        <a href="membership.html" class="choice-btn" id="choice-agent">
          <span class="choice-icon">🧳</span>
          <span class="choice-title">I am a Travel Agent</span>
          <span class="choice-desc">Get membership & manage clients</span>
        </a>

      </div>

    </div>

  </main>

  <!-- FOOTER -->
  <footer class="register-footer">
    <p>© 2025 Nomway. All rights reserved.</p>
  </footer>

</body>
</html>
