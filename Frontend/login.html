<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nomway — Sign In</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="login.css">
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/MotionPathPlugin.min.js"></script>
</head>
<body>
    <!-- Travel Animation Background -->
    <div class="travel-animation">
        <div class="globe-container">
            <div class="globe"></div>
            <div class="orbit-ring"></div>
            <div class="plane">✈️</div>
        </div>
    </div>

    <header>
        <div id="navigation"> 
            <img src="assets/funny-crazy-wolf-logo-9ee50b84-3586-47df-8ae9-aed8cb684c34-removebg-preview.png" alt="Wolf Logo">
        </div>
    </header>

    <div class="login">
        <h1 id="travel">Travel the way
            <br>
             you want .</h1>
        <h1 id="sign"> Sign Up </h1>
        <button id="google-btn"><img id="gimg" src="assets/google-logo-icon-gsuite-hd-701751694791470gzbayltphh-removebg-preview.png" alt="Google Icon">Continue with Google</button>
        <div class="divider"><span>or login</span></div>
        <input id="email" type="email" placeholder="email">
        <input id="password" type ="password" placeholder="password">
        <button id="login-btn">Login</button>
    
    </div>
    
    <script defer src="travel-animation.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="supabase.js"></script>
    <script src="login.js"></script>
</body>
</html>
